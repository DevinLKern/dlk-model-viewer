[workspace]
members = [
    "renderer",
    "spirv",
    "sandbox",
    "obj-mtl",
]

resolver = "3"

[profile.release]
codegen-units = 1
lto = "fat"
# debug = true
# strip = false
debug = false
strip = true
opt-level = 3
# panic = "abort"

[workspace.dependencies]
# winit = { version = "0.30.12", default-features = false, features = ["x11", "rwh_06"] }
winit = "0.30.12"
